<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="theme-color" content="#ffffff">
<title>Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f6f6f4;--line:#e8e8e5;--text:#121212;--muted:#7a7a76;--accent:#fc5a1c;--soft:#ffece3;--track:#ececea}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c0c;--card:#171716;--line:#262624;--text:#f4f4f2;--muted:#8c8c87;--soft:#2e1709;--track:#262624}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 40px}
.caps{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.kind{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
h1{font-size:34px;font-weight:900;letter-spacing:-1.2px;line-height:1.1}
h2{font-size:22px;font-weight:900;letter-spacing:-.8px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px}
.seg button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.days{display:flex;justify-content:space-between;margin-top:22px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.day .l{font-size:11px;font-weight:700;color:var(--muted)}
.day.sel .l{color:var(--text)}
.dot{position:relative;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.dot svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dot span{position:relative}
.day.sel .dot{background:var(--text);color:var(--bg)}
.day.full .dot{background:var(--accent);color:#fff}
.today{width:4px;height:4px;border-radius:2px}
.stats{display:flex;justify-content:space-between;margin-top:26px}
.stat b{display:block;font-size:24px;font-weight:900;letter-spacing:-.8px;margin-top:2px}
.bar{height:4px;background:var(--track);border-radius:2px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:4px;background:var(--accent)}
.meal{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line);cursor:pointer}
.meal:first-child{border-top:0}
.meal .t{font-size:17px;font-weight:800;letter-spacing:-.4px;margin:3px 0}
.meal.done .t{color:var(--muted)}
.meal .p{font-size:13.5px;font-weight:500;color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{width:14px;height:14px}
.pill{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pill.on{background:var(--text);color:var(--bg)}
.pill.acc{background:var(--accent);color:#fff}
.pill.td{color:var(--accent)}
.block{margin-top:30px;background:var(--card);border-radius:18px;padding:16px}
.block p{display:flex;gap:10px;font-size:14px;line-height:20px;margin-top:10px}
.block p:before{content:"";flex:none;width:5px;height:5px;border-radius:3px;background:var(--accent);margin-top:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item .n{flex:1;font-size:15.5px;font-weight:600}
.item small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.item .q{font-size:16px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.item.on{opacity:.45}.item.on .n{text-decoration:line-through}
.item .chk{width:24px;height:24px}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center}
.link{font-size:12px;font-weight:700;color:var(--accent)}
.ghost{display:block;margin:30px auto 0;padding:10px 18px;border-radius:999px;background:var(--card);font-size:13px;font-weight:700}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;line-height:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none}
.sheet.open{display:block}
.sheet .top{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;z-index:1}
.sheet .wrap{padding-top:8px;padding-bottom:120px}
.big{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.12;margin-top:4px}
.por{display:flex;gap:10px;margin-top:22px}
.por div{flex:1;border-radius:16px;padding:14px;background:var(--card);font-size:15px;font-weight:700;line-height:1.35}
.por div.me{background:var(--soft);outline:1.5px solid var(--accent)}
.por .caps{display:block;font-size:11px;font-weight:800;margin-bottom:6px}
.por .me .caps{color:var(--accent)}
.ing{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.ing .n{flex:1;font-weight:600}
.ing .n small{font-size:12px;color:var(--muted);font-weight:400}
.ing b{width:72px;text-align:right;font-weight:800}
.cta{position:fixed;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));height:54px;border-radius:27px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;max-width:520px;margin:0 auto}
.cta.off{background:var(--card);color:var(--text)}
.sub{font-size:13px;font-weight:500;color:var(--muted)}
h1{font-size:40px;letter-spacing:-1.6px}
.prog{display:flex;align-items:center;gap:12px;margin-top:18px}
.prog .bar{flex:1;margin:0}
.prog span{font-size:13px;font-weight:700;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.mc{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:16px 16px 16px 18px;cursor:pointer;transition:transform .1s}
.mc:active{transform:scale(.985)}
.mc .k{font-size:12px;font-weight:600;color:var(--muted)}
.mc .t{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.3;margin-top:2px}
.mc .p{font-size:13px;color:var(--muted);margin-top:4px}
.mc.done .t{color:var(--muted);text-decoration:line-through}
.mc .chk{border-color:var(--line);background:var(--bg)}
.mc .chk.on{background:var(--accent)}
.wk{margin-top:26px}
.wh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.wh b{font-size:20px;font-weight:800;letter-spacing:-.6px}
.wh span{font-size:13px;color:var(--muted)}
.wl{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.wl span{flex:none;width:74px;font-size:12px;font-weight:600;color:var(--muted);padding-top:2px}
.wl p{font-size:14.5px;line-height:1.35}
.more{margin-top:28px;background:var(--card);border-radius:18px;padding:14px 16px}
.more summary{font-size:14px;font-weight:700;cursor:pointer;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary:after{content:"+";float:right;color:var(--muted)}
.more[open] summary:after{content:"–"}
.more p{font-size:13.5px;line-height:19px;margin-top:10px;color:var(--muted)}
.more .ing{border-color:var(--line)}
.mine{margin-top:22px;background:var(--soft);border-radius:20px;padding:18px;font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.35}
.mine span{display:block;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:0;margin-bottom:6px}
.mine small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.top .round{font-size:18px}
</style>
</head>
<body>
<main id="view"></main>
<div class="sheet" id="sheet"></div>
<nav id="nav"></nav>
<script>

   estimada razonable por persona. */
const SHOPS = [

const ITEMS = {

};
const item = (id) => ITEMS[id];
/* Preparaciones que se hacen enteras (tarta, pizza): cada uno come una parte. */
const RECIPES = {
    tarta: {
        name: 'Tarta de acelga (entera)',
        ing: [
            ['acelga', 800],
            ['portSalut', 200],
            ['huevo', 3],

            ['champignon', 100],
        ],
    },
};
const OIL = ['aceite', 15, 10];
/* Lunes a domingo (índice 0 = lunes). */
const WEEK = [

        short: 'L',
        meals: [

            { kind: 'Colación', menu: 'Licuado de leche de soja, avena y cacao amargo', el: '300 ml leche de soja · 30 g avena', ella: '200 ml leche de soja · 20 g avena', ing: [['leche', 300, 200], ['avena', 30, 20], ['cacao', 10, 5]] },
            { kind: 'Cena', menu: 'Tofu salteado con brócoli y morrón + batata al horno', el: '200 g tofu · 200 g batata', ella: '130 g tofu · 130 g batata', ing: [['tofu', 200, 130], ['brocoli', 150, 120], ['morron', 80, 60], ['batata', 200, 130], OIL] },
        ],
    },
    {
        name: 'Martes',
        short: 'M',
        meals: [
            { kind: 'Desayuno', menu: 'Avena cocida con leche de soja, chía y frutos rojos + huevos duros', el: '70 g avena · 250 ml leche de soja · 2 huevos', ella: '45 g avena · 180 ml leche de soja · 1 huevo', ing: [['avena', 70, 45], ['leche', 250, 180], ['chia', 10, 5], ['frutosRojos', 80, 60], ['huevo', 2, 1]] },

            { kind: 'Merienda', menu: 'Yogur de soja + manzana con canela + nueces', el: '250 g yogur · 1 manzana · 20 g nueces', ella: '170 g yogur · 1 manzana · 10 g nueces', ing: [['yogur', 250, 170], ['manzana', 1, 1], ['nueces', 20, 10]] },
            { kind: 'Colación', menu: 'Hummus casero + bastones de zanahoria y apio', el: '100 g hummus', ella: '60 g hummus', ing: [['garbanzos', 70, 42], ['tahini', 15, 9], ['limon', 0.25, 0.15], ['zanahoria', 100, 80], ['apio', 60, 50]] },
            { kind: 'Cena', menu: 'Guiso de lentejas con calabaza, zanahoria y papa + levadura nutricional', el: '250 g lentejas · 10 g levadura', ella: '170 g lentejas · 5 g levadura', ing: [['lentejas', 250, 170], ['calabaza', 150, 100], ['zanahoria', 60, 50], ['papa', 100, 80], ['cebolla', 50, 40], ['levNutricional', 10, 5], OIL] },
        ],
    },
    {
        name: 'Viernes',
        short: 'V',
        meals: [
            { kind: 'Desayuno', menu: 'Panqueques de avena, huevo y banana + mantequilla de maní', el: '60 g avena · 3 huevos · 1 cda maní', ella: '40 g avena · 2 huevos · 1 cdta maní', ing: [['avena', 60, 40], ['huevo', 3, 2], ['banana', 1, 0.5], ['mani', 16, 5]] },
            { kind: 'Almuerzo', menu: 'Bowl de quinoa, tofu o tempeh marinado, palta y vegetales asados', el: '120 g quinoa · 150 g tofu/tempeh · ¼ palta', ella: '80 g quinoa · 100 g tofu/tempeh · ⅛ palta', ing: [['quinoa', 120, 80], ['tempeh', 150, 100], ['palta', 0.25, 0.125], ['berenjena', 100, 80], ['morron', 60, 50], ['zapallito', 80, 60], OIL] },
            { kind: 'Merienda', menu: 'Leche de soja con cacao amargo + tostadas con palta', el: '250 ml leche de soja · 2 tostadas · ¼ palta', ella: '180 ml leche de soja · 1 tostada · ⅛ palta', ing: [['leche', 250, 180], ['cacao', 10, 5], ['pan', 2, 1], ['palta', 0.25, 0.125]] },
            { kind: 'Colación', menu: 'Fruta + almendras', el: '1 fruta · 20 g almendras', ella: '1 fruta · 10 g almendras', ing: [['fruta', 1, 1], ['almendras', 20, 10]] },
            { kind: 'Cena', menu: 'Pizza casera integral (salsa natural, muzzarella, verduras) + ensalada', el: '3 porciones', ella: '2 porciones', ing: [['lechuga', 60, 50], ['rucula', 30, 20], ['tomate', 60, 50], OIL], recipe: ['pizza', 3 / 8, 2 / 8] },
        ],
    },
    {
        name: 'Sábado',
        short: 'S',
        meals: [
            { kind: 'Desayuno', menu: 'Revuelto de huevos con champiñones + pan integral + fruta', el: '4 huevos · 2 rebanadas', ella: '2 huevos · 1 rebanada', ing: [['huevo', 4, 2], ['champignon', 80, 60], ['pan', 2, 1], ['fruta', 1, 1]] },
            { kind: 'Almuerzo', menu: 'Fideos integrales con boloñesa de lentejas + levadura nutricional', el: '100 g fideos secos · 150 g lentejas', ella: '70 g fideos secos · 100 g lentejas', ing: [['fideos', 100, 70], ['lentejas', 150, 100], ['pureTomate', 150, 100], ['cebolla', 50, 40], ['zanahoria', 50, 40], ['levNutricional', 8, 5], OIL] },
            { kind: 'Merienda', menu: 'Yogur de soja con frutos rojos y chía', el: '250 g yogur', ella: '170 g yogur', ing: [['yogur', 250, 170], ['frutosRojos', 80, 60], ['chia', 10, 5]] },
            { kind: 'Colación', menu: 'Licuado de leche de soja, avena y cacao amargo', el: '300 ml leche de soja · 30 g avena', ella: '200 ml leche de soja · 20 g avena', ing: [['leche', 300, 200], ['avena', 30, 20], ['cacao', 10, 5]] },
            { kind: 'Cena', menu: 'Tortilla de espinaca al horno (huevo + tofu) + ensalada de tomate', el: '3 huevos · 100 g tofu', ella: '2 huevos · 60 g tofu', ing: [['huevo', 3, 2], ['tofu', 100, 60], ['espinaca', 100, 80], ['tomate', 150, 120], OIL] },
        ],
    },
    {
        name: 'Domingo',
        short: 'D',
        meals: [
            { kind: 'Brunch', menu: 'Huevos revueltos + palta + pan integral + yogur de soja con fruta', el: '3 huevos · ¼ palta · 2 rebanadas · 150 g yogur', ella: '2 huevos · ⅛ palta · 1 rebanada · 100 g yogur', ing: [['huevo', 3, 2], ['palta', 0.25, 0.125], ['pan', 2, 1], ['yogur', 150, 100], ['fruta', 1, 1]] },
            { kind: 'Almuerzo', menu: 'Comida libre — un plato razonable, sin repetir', el: '—', ella: '—', ing: [], free: true },
            { kind: 'Merienda', menu: 'Fruta + frutos secos', el: '1 fruta · 20 g', ella: '1 fruta · 10 g', ing: [['fruta', 1, 1], ['mixFrutos', 20, 10]] },
            { kind: 'Cena', menu: 'Crema de calabaza + ensalada tibia de garbanzos con huevo duro', el: '180 g garbanzos · 2 huevos', ella: '120 g garbanzos · 1 huevo', ing: [['calabaza', 250, 200], ['cebolla', 50, 40], ['leche', 100, 80], ['garbanzos', 180, 120], ['huevo', 2, 1], ['lechuga', 50, 40], OIL] },
        ],
    },
];
/* Lo de todos los días que no es una comida: omega-3 vegetal. */
const DAILY = [['lino', 10, 10]];
const PROFILE = {
    el: { label: 'Él', kcal: '2.500', prot: '150', goal: '95 → 85 kg' },
    ella: { label: 'Ella', kcal: '1.750', prot: '100', goal: '58 → 55 kg' },
};
const OIL_RULE = { el: '1 cda de aceite', ella: '2 cdtas de aceite' };
const RULES = [
    'Legumbres, arroz y quinoa: pesos en cocido.',
    'Verduras de hoja y no feculentas: libres.',
    'Aceite de oliva medido: 1 cda (él) / 2 cdtas (ella) por comida principal.',
    'Agua: 2,5–3 L por día.',
    'Sal yodada.',
    'Colación: antes o después de entrenar.',
];
const SUPPLEMENTS = [
    ['B12', '1000 mcg, 2 veces por semana.'],
    ['Creatina', '3–5 g todos los días, con cualquier comida.'],
    ['Omega-3', '1 cda de lino molido o chía por día, o omega-3 de algas.'],
    ['Vitamina D', 'Hacer un análisis antes de suplementar.'],
    ['Hierro', 'Legumbres + vitamina C (limón, morrón, cítricos). Café o mate lejos de las comidas.'],
];
const ADJUSTMENTS = [
    'Pesarse 2–3 veces por semana en ayunas y mirar el promedio semanal.',
    'Si en 2 semanas no baja: sacar media colación o ½ porción de carbohidratos en la cena.',
    'Si baja más de 1 kg/sem (él) o 0,5 kg/sem (ella), o rinden mal entrenando: sumar ½ porción de carbohidratos los días de entrenamiento.',
];
const MAIN_MEALS = ['Almuerzo', 'Cena'];


// ── Estado (se guarda en el teléfono) ──
const KEY = 'plan.state.v1';
let S = { person: 'el', done: { el: {}, ella: {} }, bought: {} };
try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v) S = { ...S, ...v, done: { el: {}, ella: {}, ...v.done } }; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let tab = 'hoy', sel = null, semDay = null, who = 'ambos', shopDays = [0,1,2,3,4,5,6];

// ── Fechas ──
const pad = n => String(n).padStart(2, '0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const pIdx = d => (d.getDay() + 6) % 7;
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const longDate = d => `${d.getDate()} de ${MONTHS[d.getMonth()]}`;
const lastDays = n => { const t = new Date(); return Array.from({length:n}, (_, i) => { const d = new Date(t); d.setDate(t.getDate() - (n-1-i)); return d; }); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vib = () => { try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} };

const CHECK = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const chk = on => `<span class="chk ${on ? 'on' : ''}">${on ? CHECK : ''}</span>`;
const ring = v => { const r = 18.5, len = 2*Math.PI*r; return `<svg width="40" height="40"><circle cx="20" cy="20" r="${r}" stroke="var(--track)" stroke-width="3" fill="none"/>${v > 0 ? `<circle cx="20" cy="20" r="${r}" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="${len*Math.min(1,v)} ${len}"/>` : ''}</svg>`; };
const seg = (opts, val, fn) => `<div class="seg">${opts.map(([id, l]) => `<button class="${id === val ? 'on' : ''}" onclick="${fn}('${id}')">${l}</button>`).join('')}</div>`;

function toggleMeal(p, date, i) {
  const l = S.done[p][date] || [];
  S.done[p][date] = l.includes(i) ? l.filter(x => x !== i) : [...l, i];
  save(); vib(); render();
}

// ── Hoy ──
const SHORT_M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function viewHoy() {
  const d = new Date(), k = dKey(d), di = pIdx(d), day = WEEK[di], p = S.person, list = S.done[p][k] || [];
  const n = list.length, tot = day.meals.length;
  return `<div class="wrap">
    <div class="row between"><span class="sub">${day.name} ${d.getDate()} ${SHORT_M[d.getMonth()]}</span>${seg([['el','Él'],['ella','Ella']], p, 'setPerson')}</div>
    <h1 style="margin-top:6px">Hoy</h1>
    <div class="prog"><div class="bar"><i style="width:${n / tot * 100}%"></i></div><span>${n}/${tot}</span></div>
    <div class="cards">${day.meals.map((m, i) => { const on = list.includes(i); return `<div class="mc ${on ? 'done' : ''}" onclick="openMeal(${di},${i},'${k}')">
      <div style="flex:1;min-width:0"><div class="k">${m.kind}</div><div class="t">${esc(m.menu)}</div>${m.free ? '' : `<div class="p">${esc(m[p])}</div>`}</div>
      <button onclick="event.stopPropagation();toggleMeal('${p}','${k}',${i})">${chk(on)}</button></div>`; }).join('')}</div>
  </div>`;
}
function setPerson(p) { S.person = p; save(); render(); }

// ── Semana: hoy y los días que vienen ──
function viewSemana() {
  const p = S.person, t = new Date();
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(t); d.setDate(t.getDate() + i); return d; });
  return `<div class="wrap">
    <div class="row between"><span class="sub">Próximos 7 días</span>${seg([['el','Él'],['ella','Ella']], p, 'setPerson')}</div>
    <h1 style="margin-top:6px">Semana</h1>
    ${days.map((d, i) => { const di = pIdx(d), day = WEEK[di];
      const label = i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : day.name;
      return `<div class="wk"><div class="wh"><b>${label}</b><span>${i < 2 ? day.name + ' ' : ''}${d.getDate()} ${SHORT_M[d.getMonth()]}</span></div>
        ${day.meals.map((m, j) => `<div class="wl" onclick="openMeal(${di},${j})"><span>${m.kind}</span><p>${esc(m.menu)}</p></div>`).join('')}</div>`; }).join('')}
    <details class="more"><summary>Reglas y suplementos</summary>${[...RULES, ...SUPPLEMENTS.map(([a, b]) => `${a}: ${b}`), ...ADJUSTMENTS].map(x => `<p>${esc(x)}</p>`).join('')}</details>
  </div>`;
}

// ── Detalle de comida ──
const frac = n => { const w = Math.floor(n + 1e-6), r = n - w; if (r < 1e-6) return String(w);
  const f = [[0.125,'⅛'],[0.15,'⅛'],[1/6,'⅙'],[0.25,'¼'],[3/8,'⅜'],[0.5,'½']].find(([v]) => Math.abs(v - r) < 0.02); const s = f ? f[1] : String(Math.round(r*10)/10); return w ? w + s : s; };
const amt = (id, n, p) => id === 'aceite' && p ? (p === 'el' ? '1 cda' : '2 cdtas') : ITEMS[id].unit === 'u' ? frac(n) : `${n} ${ITEMS[id].unit}`;

function openMeal(di, i, fecha) {
  vib();
  const day = WEEK[di], m = day.meals[i], p = S.person, o = p === 'el' ? 'ella' : 'el', el = document.getElementById('sheet');
  const done = fecha ? (S.done[p][fecha] || []).includes(i) : false;
  let body = '';
  if (m.free) body = `<p class="sub" style="margin-top:16px">Un plato razonable, sin repetir.</p>`;
  else {
    body += `<div class="mine"><span>Tu porción</span>${esc(m[p]).split(' · ').join('<br>')}${MAIN_MEALS.includes(m.kind) ? `<small>+ ${OIL_RULE[p]} de oliva</small>` : ''}</div>`;
    body += `<p class="sub" style="margin-top:12px">${PROFILE[o].label}: ${esc(m[o])}</p>`;
    let rows = '';
    if (m.recipe) rows += `<div class="ing"><span class="n">${RECIPES[m.recipe[0]].name}</span><b>${frac(m.recipe[p === 'el' ? 1 : 2])}</b></div>`;
    rows += m.ing.map(([id, a, b]) => `<div class="ing"><span class="n">${ITEMS[id].name}${ITEMS[id].raw ? ' <small>cocido</small>' : ''}</span><b>${amt(id, p === 'el' ? a : b, p)}</b></div>`).join('');
    body += `<details class="more"><summary>Ingredientes</summary>${rows}</details>`;
  }
  el.innerHTML = `<div class="top"><button onclick="closeMeal()" class="round" aria-label="Volver">←</button></div>
    <div class="wrap"><span class="sub">${m.kind} · ${day.name}</span><div class="big">${esc(m.menu)}</div>${body}</div>
    ${fecha ? `<button class="cta ${done ? 'off' : ''}" onclick="toggleMeal('${p}','${fecha}',${i});${done ? `openMeal(${di},${i},'${fecha}')` : 'closeMeal()'}">${done ? 'Desmarcar' : 'Listo'}</button>` : ''}`;
  el.classList.add('open'); el.scrollTop = 0;
}
function closeMeal() { document.getElementById('sheet').classList.remove('open'); }

// ── Compras ──
function buildList(days, people) {
  const total = {}; const add = (id, n) => total[id] = (total[id] || 0) + n;
  const share = (a, b) => people.reduce((s, q) => s + (q === 'el' ? a : b), 0);
  for (const d of days) {
    for (const m of WEEK[d].meals) {
      for (const [id, a, b] of m.ing) add(id, share(a, b));
      if (m.recipe) { const t = Math.ceil(share(m.recipe[1], m.recipe[2]) - 1e-6); for (const [id, n] of RECIPES[m.recipe[0]].ing) add(id, n * t); }
    }
    for (const [id, a, b] of DAILY) add(id, share(a, b));
  }
  const up = (n, s) => Math.ceil(n / s - 1e-6) * s, num = n => String(Math.round(n * 10) / 10).replace('.', ',');
  const g = x => { const r = x < 100 ? up(x, 10) : up(x, 50); return r >= 1000 ? `${num(r / 1000)} kg` : `${r} g`; };
  const line = (id, n) => { const it = ITEMS[id], b = { id, name: it.name };
    if (id === 'huevo') { const u = Math.ceil(n); return { ...b, qty: `${u} u`, note: `≈ ${num(up(u / 12, 0.5))} docenas` }; }
    if (id === 'pan') { const u = Math.ceil(n); return { ...b, qty: `${u} rebanadas`, note: `≈ ${Math.ceil(u / 18)} paquete${u > 18 ? 's' : ''}` }; }
    if (it.unit === 'u') { const u = Math.ceil(n - 1e-6), w = it.word || ['u', 'u']; return { ...b, qty: `${u} ${u === 1 ? w[0] : w[1]}` }; }
    if (it.unit === 'ml') return { ...b, qty: n >= 1000 ? `${num(up(n / 1000, 0.5))} L` : `${up(n, 50)} ml` };
    if (it.raw) return { ...b, qty: g(n * it.raw), note: `en seco · rinde ${g(n)} cocido` };
    return { ...b, qty: g(n) }; };
  const order = Object.keys(ITEMS);
  return SHOPS.map(s => ({ ...s, lines: order.filter(id => ITEMS[id].shop === s.id && total[id] > 0).map(id => line(id, total[id])) })).filter(s => s.lines.length);
}
const PEOPLE = { ambos: ['el', 'ella'], el: ['el'], ella: ['ella'] };
let lastList = [];
function viewCompras() {
  const secs = lastList = buildList(shopDays, PEOPLE[who]);
  const count = secs.reduce((s, x) => s + x.lines.length, 0), got = secs.reduce((s, x) => s + x.lines.filter(l => S.bought[l.id]).length, 0);
  return `<div class="wrap">
    <div class="row between" style="align-items:flex-end"><div><div class="caps">${got}/${count} en el changuito</div><h1>Compras</h1></div>
    <button class="round" onclick="shareList()" aria-label="Compartir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg></button></div>
    <div class="row between" style="margin-top:20px"><span class="caps" style="font-weight:800">Para</span>${seg([['ambos','Ambos'],['el','Él'],['ella','Ella']], who, 'setWho')}</div>
    <div class="row between" style="margin-top:16px"><span class="caps" style="font-weight:800">Días</span><button class="link" onclick="shopDays=shopDays.length===7?[]:[0,1,2,3,4,5,6];render()">${shopDays.length === 7 ? 'Ninguno' : 'Toda la semana'}</button></div>
    <div class="days" style="margin-top:10px">${WEEK.map((d, i) => `<button class="pill ${shopDays.includes(i) ? 'acc' : ''}" onclick="toggleShopDay(${i})">${d.short}</button>`).join('')}</div>
    ${secs.length ? '' : '<p class="muted" style="text-align:center;margin-top:40px">Elegí al menos un día.</p>'}
    ${secs.map(s => `<div style="margin-top:30px"><div class="row between" style="margin-bottom:4px"><h2>${s.name}</h2><span class="caps" style="letter-spacing:0">${s.lines.filter(l => S.bought[l.id]).length}/${s.lines.length}</span></div>
      ${s.lines.map(l => `<div class="item ${S.bought[l.id] ? 'on' : ''}" onclick="toggleBought('${l.id}')">${chk(!!S.bought[l.id])}<span class="n">${l.name}${l.note ? `<small>${l.note}</small>` : ''}</span><span class="q">${l.qty}</span></div>`).join('')}</div>`).join('')}
    ${got ? '<button class="ghost" onclick="S.bought={};save();render()">Empezar lista nueva</button>' : ''}
    <p class="note">Legumbres y cereales en seco. Verduras libres con cantidad estimada.<br>Incluye lino molido diario (omega-3).</p>
  </div>`;
}
function setWho(w) { who = w; render(); }
function toggleShopDay(i) { shopDays = shopDays.includes(i) ? shopDays.filter(x => x !== i) : [...shopDays, i].sort(); vib(); render(); }
function toggleBought(id) { S.bought[id] = !S.bought[id]; save(); vib(); render(); }
function shareList() {
  const label = shopDays.length === 7 ? 'semana completa' : shopDays.map(d => WEEK[d].name).join(', ');
  const out = [`Lista de compras · ${label}${who === 'ambos' ? '' : ' · ' + PROFILE[who].label}`, ''];
  for (const s of lastList) { out.push(s.name.toUpperCase()); for (const l of s.lines) out.push(`• ${l.name}: ${l.qty}${l.note ? ` (${l.note})` : ''}`); out.push(''); }
  const text = out.join('\n').trim();
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('Lista copiada'));
}

// ── Navegación ──
const ICONS = {
  hoy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><rect x="7" y="12" width="4" height="4" rx="1" fill="currentColor"/></svg>',
  semana: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  compras: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
};
function render() {
  document.getElementById('view').innerHTML = tab === 'hoy' ? viewHoy() : tab === 'semana' ? viewSemana() : viewCompras();
  document.getElementById('nav').innerHTML = [['hoy','Hoy'],['semana','Semana'],['compras','Compras']].map(([id, l]) => `<button class="${tab === id ? 'on' : ''}" onclick="go('${id}')">${ICONS[id]}${l}</button>`).join('');
}
function go(t) { tab = t; vib(); closeMeal(); render(); window.scrollTo(0, 0); }
render();
</script>
